version: '3.8'

services:
  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetrack-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=INFO
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - DYNAMODB_TABLE_NAME=TimeTrack-Transit-DB
      - DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - STATION_NAME=Humble Transit Station
      - STATION_TIMEZONE=America/Chicago
      - LATE_THRESHOLD_MINUTES=5
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - timetrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Frontend Service
  frontend:
    image: nginx:alpine
    container_name: timetrack-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - timetrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DynamoDB Local for Development/Testing
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: timetrack-dynamodb
    ports:
      - "8001:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - timetrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  timetrack-network:
    driver: bridge

volumes:
  dynamodb-data:
